<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Teodor Todorov — Full-Stack Engineer & Researcher">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="60%"  stop-color="#F6F8FA"/>
      <stop offset="100%" stop-color="#EFEAFE"/>
    </linearGradient>
    <linearGradient id="accentL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#6D28D9" stop-opacity="0.18"/>
      <stop offset="60%"  stop-color="#0891B2" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridL" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#D1D5DB" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bgL)"/>
  <rect width="1280" height="320" fill="url(#gridL)"/>
  <circle cx="1060" cy="160" r="220" fill="url(#glowL)"/>

  <rect x="72" y="92" width="56" height="3" rx="1.5" fill="url(#accentL)"/>

  <text x="72" y="80"
        font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, monospace"
        font-size="14" letter-spacing="6" fill="#0891B2" opacity="0.95">
    ENGINEER · RESEARCHER
  </text>

  <text x="72" y="172"
        font-family="'Inter Tight', Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="78" font-weight="700" fill="#0F172A" letter-spacing="-2">
    Teodor Todorov
  </text>

  <text x="72" y="218"
        font-family="'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="22" font-weight="400" fill="#475569">
    Building production web apps at the intersection of AI, education &amp; applied research.
  </text>

  <g font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, monospace"
     font-size="13" fill="#64748B">
    <circle cx="80" cy="258" r="3.5" fill="#16A34A"/>
    <text x="92" y="262">open to collaboration &amp; freelance</text>
    <line x1="370" y1="251" x2="370" y2="266" stroke="#CBD5E1"/>
    <text x="388" y="262">Veliko Tarnovo · Bulgaria</text>
    <line x1="620" y1="251" x2="620" y2="266" stroke="#CBD5E1"/>
    <text x="638" y="262">UTC+2</text>
  </g>

  <g transform="translate(960,60)">
    <rect x="0" y="0" width="200" height="200" rx="28" fill="#FFFFFF" stroke="url(#accentL)" stroke-width="1.5"/>
    <g stroke="url(#accentL)" stroke-width="11" stroke-linecap="round" fill="none">
      <line x1="40"  y1="62"  x2="100" y2="62"/>
      <line x1="70"  y1="62"  x2="70"  y2="152"/>
    </g>
    <g stroke="#0891B2" stroke-width="11" stroke-linecap="round" fill="none">
      <line x1="118" y1="62"  x2="178" y2="62"/>
      <line x1="148" y1="62"  x2="148" y2="152"/>
    </g>
    <line x1="40" y1="168" x2="178" y2="168" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>

  <rect x="0" y="318" width="1280" height="2" fill="url(#accentL)" opacity="0.55"/>
</svg>
