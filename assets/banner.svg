<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Teodor Todorov — Full-Stack Engineer & Researcher">
  <defs>
    <!-- background gradient (dark) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0B0E14"/>
      <stop offset="55%"  stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#141029"/>
    </linearGradient>

    <!-- accent gradient (violet → cyan) -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- soft glow for the monogram -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="60%"  stop-color="#22D3EE" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <!-- subtle dotted grid -->
    <pattern id="grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1F2937" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- base layers -->
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- right-side glow halo behind monogram -->
  <circle cx="1060" cy="160" r="220" fill="url(#glow)"/>

  <!-- left accent rule -->
  <rect x="72" y="92" width="56" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- eyebrow label -->
  <text x="72" y="80"
        font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, monospace"
        font-size="14" letter-spacing="6" fill="#22D3EE" opacity="0.9">
    ENGINEER · RESEARCHER
  </text>

  <!-- name -->
  <text x="72" y="172"
        font-family="'Inter Tight', Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="78" font-weight="700" fill="#F3F4F6" letter-spacing="-2">
    Teodor Todorov
  </text>

  <!-- tagline -->
  <text x="72" y="218"
        font-family="'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="22" font-weight="400" fill="#8B949E">
    Building production web apps at the intersection of AI, education &amp; applied research.
  </text>

  <!-- meta row -->
  <g font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, monospace"
     font-size="13" fill="#6B7280">
    <circle cx="80" cy="258" r="3.5" fill="#3FB950">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="92" y="262">open to collaboration &amp; freelance</text>

    <line x1="370" y1="251" x2="370" y2="266" stroke="#374151"/>
    <text x="388" y="262">Veliko Tarnovo · Bulgaria</text>

    <line x1="620" y1="251" x2="620" y2="266" stroke="#374151"/>
    <text x="638" y="262">UTC+2</text>
  </g>

  <!-- monogram T + T -->
  <g transform="translate(960,60)">
    <!-- frame -->
    <rect x="0" y="0" width="200" height="200" rx="28" fill="#0D1117" stroke="url(#accent)" stroke-width="1.5"/>
    <!-- first T -->
    <g stroke="url(#accent)" stroke-width="11" stroke-linecap="round" fill="none">
      <line x1="40"  y1="62"  x2="100" y2="62"/>
      <line x1="70"  y1="62"  x2="70"  y2="152"/>
    </g>
    <!-- second T -->
    <g stroke="#22D3EE" stroke-width="11" stroke-linecap="round" fill="none" opacity="0.95">
      <line x1="118" y1="62"  x2="178" y2="62"/>
      <line x1="148" y1="62"  x2="148" y2="152"/>
    </g>
    <!-- subtle baseline -->
    <line x1="40" y1="168" x2="178" y2="168" stroke="#1F2937" stroke-width="1.5"/>
  </g>

  <!-- bottom hairline accent -->
  <rect x="0" y="318" width="1280" height="2" fill="url(#accent)" opacity="0.6"/>
</svg>
